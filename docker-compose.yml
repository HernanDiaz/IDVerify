name: docverify-api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docverify
      POSTGRES_PASSWORD: docverify
      POSTGRES_DB: docverify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docverify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: [.env]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro   # trained weights (never committed)
      - appdata:/data          # uploaded images + generated masks (shared with worker)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    env_file: [.env]
    # -B runs Celery Beat embedded in the single worker (retention sweep).
    command: celery -A app.workers.celery_app.celery_app worker -B --loglevel=info --concurrency=1
    volumes:
      - ./models:/models:ro
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
