name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app tests
      - name: mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docverify
          POSTGRES_PASSWORD: docverify
          POSTGRES_DB: docverify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docverify"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://docverify:docverify@localhost:5432/docverify
      REDIS_URL: redis://localhost:6379/0
      USE_MOCK_MODEL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest (fast suite on Postgres + Redis)
        run: pytest -m "not slow" -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docverify
          POSTGRES_PASSWORD: docverify
          POSTGRES_DB: docverify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docverify"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://docverify:docverify@localhost:5432/docverify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: alembic upgrade + downgrade (round-trip)
        run: |
          alembic upgrade head
          alembic downgrade base
